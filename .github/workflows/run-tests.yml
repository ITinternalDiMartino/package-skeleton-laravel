name: run tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

jobs:
  tests:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/pest-packages.yml@main
    with:
      php-versions: '["8.3"]'
      stability: '["prefer-stable"]'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
